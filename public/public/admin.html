<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Ventrax CMS</title>

<style>
body{
  margin:0;
  background:#071126;
  color:#eef4ff;
  font:16px Arial,sans-serif;
}

.wrap{
  width:min(94%,900px);
  margin:auto;
}

header{
  padding:20px 0;
  border-bottom:1px solid #26385e;
}

h1{margin:0}

.panel{
  background:#102044;
  border:1px solid #26385e;
  border-radius:14px;
  padding:20px;
  margin:25px 0;
}

label{
  display:block;
  margin:14px 0 6px;
  font-weight:700;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border-radius:8px;
  border:1px solid #304568;
  background:#071126;
  color:#fff;
  box-sizing:border-box;
}

textarea{
  min-height:180px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.btn{
  margin-top:15px;
  padding:11px 16px;
  border:0;
  border-radius:8px;
  font-weight:800;
  background:#4edbff;
  color:#061024;
}

.danger{
  background:#ef7777;
}

.muted{
  color:#aab8d4;
}

.post{
  padding:14px 0;
  border-bottom:1px solid #26385e;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.message{
  margin-top:12px;
  font-weight:bold;
}

@media(max-width:650px){
  .row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>AI Ventrax CMS</h1>
<div class="muted">Admin Dashboard</div>
</div>
</header>

<main class="wrap">

<!-- LOGIN -->

<div id="login" class="panel">

<h2>Admin Login</h2>

<p class="muted">
Enter the ADMIN_PASSWORD configured in Railway.
</p>

<input
id="pw"
type="password"
placeholder="Admin password"
>

<button class="btn" onclick="login()">
Login
</button>

<p id="lm" class="message"></p>

</div>


<!-- DASHBOARD -->

<div id="dash" style="display:none">

<div class="panel">

<h2 id="formTitle">
Add New Article
</h2>

<form id="form">

<input
type="hidden"
id="id"
>

<label>
Title
</label>

<input
id="title"
required
placeholder="Enter article title"
>


<div class="row">

<div>

<label>
Category
</label>

<select id="category">

<option>AI News</option>
<option>AI Tools</option>
<option>Technology</option>
<option>Tutorials</option>
<option>Reviews</option>
<option>Cybersecurity</option>
<option>Online Earning</option>

</select>

</div>


<div>

<label>
Featured Image URL
</label>

<input
id="image"
placeholder="https://example.com/image.jpg"
>

</div>

</div>


<label>
Excerpt
</label>

<textarea
id="excerpt"
style="min-height:90px"
placeholder="Short description of the article"
></textarea>


<label>
Article Content
</label>

<textarea
id="content"
placeholder="Write your article here. HTML is allowed."
></textarea>


<div class="row">

<div>

<label>
Author
</label>

<input
id="author"
value="AI Ventrax"
>

</div>


<div>

<label>
Status
</label>

<select id="status">

<option value="published">
Published
</option>

<option value="draft">
Draft
</option>

</select>

</div>

</div>


<button
class="btn"
type="submit"
>
Save Article
</button>


<button
class="btn"
type="button"
onclick="resetForm()"
>
Clear
</button>

<p
id="msg"
class="message"
></p>

</form>

</div>


<!-- ARTICLES -->

<div class="panel">

<h2>
Articles
</h2>

<div id="posts">

<p class="muted">
Loading articles...
</p>

</div>

</div>

</div>

</main>


<script>

let token='';


/* LOGIN */

async function login(){

const password=
document.getElementById('pw').value;

try{

const response=
await fetch('/api/login',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
password:password
})
});

const data=
await response.json();

if(!response.ok){

document.getElementById('lm').textContent=
data.error || 'Login failed';

return;

}

token=data.token;

document.getElementById('login').style.display='none';

document.getElementById('dash').style.display='block';

load();

}catch(error){

document.getElementById('lm').textContent=
'Connection error';

}

}


/* LOAD ARTICLES */

async function load(){

try{

const response=
await fetch('/api/admin/posts',{
headers:{
Authorization:'Bearer '+token
}
});

const posts=
await response.json();

const container=
document.getElementById('posts');

if(!posts.length){

container.innerHTML=
'<p class="muted">No articles yet.</p>';

return;

}

container.innerHTML=
posts.map(post=>`

<div class="post">

<b>
${esc(post.title)}
</b>

<div class="muted">

${esc(post.category)}
•
${esc(post.status)}
•
${esc(post.date || '')}

</div>

<div class="actions">

<button
class="btn"
onclick='editPost(${JSON.stringify(post)})'
>
Edit
</button>

<button
class="btn danger"
onclick="deletePost('${post.id}')"
>
Delete
</button>

</div>

</div>

`).join('');

}catch(error){

document.getElementById('posts').innerHTML=
'<p class="muted">Unable to load articles.</p>';

}

}


/* ESCAPE HTML */

function esc(value=''){

return String(value).replace(
/[&<>"']/g,
function(c){

return {

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'

}[c];

});

}


/* EDIT ARTICLE */

function editPost(post){

document.getElementById('id').value=
post.id || '';

document.getElementById('title').value=
post.title || '';

document.getElementById('category').value=
post.category || 'AI News';

document.getElementById('image').value=
post.image || '';

document.getElementById('excerpt').value=
post.excerpt || '';

document.getElementById('content').value=
post.content || '';

document.getElementById('author').value=
post.author || 'AI Ventrax';

document.getElementById('status').value=
post.status || 'published';

document.getElementById('formTitle').textContent=
'Edit Article';

window.scrollTo({
top:0,
behavior:'smooth'
});

}


/* CLEAR FORM */

function resetForm(){

document.getElementById('form').reset();

document.getElementById('id').value='';

document.getElementById('author').value=
'AI Ventrax';

document.getElementById('formTitle').textContent=
'Add New Article';

}


/* SAVE ARTICLE */

document.getElementById('form').onsubmit=
async function(event){

event.preventDefault();

const id=
document.getElementById('id').value;

const article={

title:
document.getElementById('title').value,

category:
document.getElementById('category').value,

image:
document.getElementById('image').value,

excerpt:
document.getElementById('excerpt').value,

content:
document.getElementById('content').value,

author:
document.getElementById('author').value,

status:
document.getElementById('status').value

};


/* NEW OR EDIT */

const method=
id ? 'PUT' : 'POST';

const url=
id
? '/api/admin/posts/'+encodeURIComponent(id)
: '/api/admin/posts';


try{

const response=
await fetch(url,{
method:method,
headers:{
'Content-Type':'application/json',
Authorization:'Bearer '+token
},
body:JSON.stringify(article)
});

const data=
await response.json();

document.getElementById('msg').textContent=
data.error || 'Article saved successfully!';

if(response.ok){

resetForm();

load();

}

}catch(error){

document.getElementById('msg').textContent=
'Error saving article';

}

};


/* DELETE ARTICLE */

async function deletePost(id){

if(!confirm('Delete this article?')){

return;

}

try{

await fetch(
'/api/admin/posts/'+encodeURIComponent(id),
{
method:'DELETE',
headers:{
Authorization:'Bearer '+token
}
}
);

load();

}catch(error){

alert('Unable to delete article');

}

}

</script>

</body>
</html>
